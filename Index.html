<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Payment Optimizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script defer src="Script.js"></script>
  <script defer src="UI.js"></script>
  <link rel="stylesheet" href="Styles.css">
</head>
<body>
  <h1>Loan Payment Manager</h1>
  <div class="container" id="loan-table">
    <fieldset id="loans">
      <legend>Loans</legend>
        <ul id="view-toggle">
          <li id="list-view" onclick="listView()"><a><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M4 22h-4v-4h4v4zm0-12h-4v4h4v-4zm0-8h-4v4h4v-4zm3 0v4h17v-4h-17zm0 12h17v-4h-17v4zm0 8h17v-4h-17v4z"/></svg></a></li>
          <li class="active-view" id="grid-view" onclick="gridView()"><a><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M11 11h-11v-11h11v11zm13 0h-11v-11h11v11zm-13 13h-11v-11h11v11zm13 0h-11v-11h11v11z"/></svg></a></li>
        </ul>
      <div class="loan-container grid">
        <button id="add-entry" onclick="addEntry()">+</button>
      </div>
    </fieldset>
  </div>

  <div class="container" id="user-details">
    <form id="dateForm">
      <div>
        <label for="user-budget">Budget: </label>
        <input onchange="setBudget()" type="number" id="user-budget" placeholder="$$$" step="1" min="0" required>
      </div>
      <div>
        <label for="paymentDate">Last Payment Date: </label>
        <input type="date" id="paymentDate" required>
      </div>
      <button type="submit" id="submit-loans">Subumit Entries</button>
    </form>
  </div>
  
    <div class="container" id="loanInfo">
      <div id="graph">

      </div>
    </div>

    <div class="container" id="remainingBudget">
      <!-- Display remaining budget here -->
    </div>
</body>
</html>
