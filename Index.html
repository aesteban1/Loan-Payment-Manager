<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Payment Optimizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script defer src="Script.js"></script>
  <script defer src="UI.js"></script>
  <link rel="stylesheet" href="Styles.css">
</head>
<body>
  <h1>Loan Payment Manager</h1>
  <form id="blank-modal" class="editable-modal"></form>

  <div id="overlay"></div>
  <div class="container" id="loan-table">
    <fieldset id="loans">
      <legend>Loans</legend>
      <div id="utilities">
        <ul id="view-toggle">
          <li id="list-view" class="active-view"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M4 22h-4v-4h4v4zm0-12h-4v4h4v-4zm0-8h-4v4h4v-4zm3 0v4h17v-4h-17zm0 12h17v-4h-17v4zm0 8h17v-4h-17v4z"/></svg></li>
          <li id="grid-view"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M11 11h-11v-11h11v11zm13 0h-11v-11h11v11zm-13 13h-11v-11h11v11zm13 0h-11v-11h11v11z"/></svg></li>
        </ul>
        <ul id="tools">
          <li id="multi-select"><svg xmlns="http://www.w3.org/2000/svg"  stroke-width="3" width="24" height="24" viewBox="0 0 24 24"><path d="M13 24v-13.333l10 8.333h-6.156l-3.844 5zm8-20h2v-4h-4v2h2v2zm0 6h2v-4h-2v4zm-4-10h-4v2h4v-2zm4 14.73l2 1.645v-4.375h-2v2.73zm-10-14.73h-4v2h4v-2zm0 20h-4v2h4v-2zm-10-16h2v-2h2v-2h-4v4zm2 2h-2v4h2v-4zm0 6h-2v4h2v-4zm0 6h-2v4h4v-2h-2v-2z"/></svg></li>
          <li id="filter-entries"><svg clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m15.344 17.778c0-.414-.336-.75-.75-.75h-5.16c-.414 0-.75.336-.75.75s.336.75.75.75h5.16c.414 0 .75-.336.75-.75zm2.206-4c0-.414-.336-.75-.75-.75h-9.596c-.414 0-.75.336-.75.75s.336.75.75.75h9.596c.414 0 .75-.336.75-.75zm2.45-4c0-.414-.336-.75-.75-.75h-14.5c-.414 0-.75.336-.75.75s.336.75.75.75h14.5c.414 0 .75-.336.75-.75zm2-4c0-.414-.336-.75-.75-.75h-18.5c-.414 0-.75.336-.75.75s.336.75.75.75h18.5c.414 0 .75-.336.75-.75z" fill-rule="nonzero"/></svg></li>
          <li id="duplicate-entry"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M15.143 13.244l.837-2.244 2.698 5.641-5.678 2.502.805-2.23s-8.055-3.538-7.708-10.913c2.715 5.938 9.046 7.244 9.046 7.244zm8.857-7.244v18h-18v-6h-6v-18h18v6h6zm-2 2h-12.112c-.562-.578-1.08-1.243-1.521-2h7.633v-4h-14v14h4v-3.124c.6.961 1.287 1.823 2 2.576v6.548h14v-14z"/></svg></li>
        </ul>
      </div>
      <div class="loan-container list"></div>
    </fieldset>
  </div>

  <div class="container" id="user-details">
    <form id="dateForm">
      <div>
        <label for="user-budget">Budget: </label>
        <input onchange="setBudget()" type="number" id="user-budget" placeholder="$$$" step="1" min="0" required>
      </div>
      <div>
        <label for="paymentDate">Last Payment Date: </label>
        <input type="date" id="paymentDate" required>
      </div>
      <button type="submit" id="submit-loans">Subumit Entries</button>
    </form>
  </div>
  
    <div class="container" id="loanInfo">
      <div id="graph">

      </div>
    </div>

    <div class="container" id="remainingBudget">
      <!-- Display remaining budget here -->
    </div>
</body>
</html>
